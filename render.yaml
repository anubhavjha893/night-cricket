services:
  - type: web
    name: ugm-cricket-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: node backend/src/server.js
    healthCheckPath: /api/ready
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: COOKIE_SAME_SITE
        value: lax
      - key: TRUST_PROXY
        value: '0'
      - key: PAYMENT_PAYEE_NAME
        value: Anubhav Jha
      - key: PAYMENT_UPI_ID
        value: 8210708838sbi@axl
      - key: REQUEST_LOGS
        value: 'true'
      - key: PASSWORD_SCHEME_ENABLED
        value: 'false'
